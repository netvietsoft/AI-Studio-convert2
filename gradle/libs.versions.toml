# Single source of truth for dependency versions — mirrors Docs/Architecture/android.md §1.
# Nguồn version duy nhất — khớp Docs/Architecture/android.md §1.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
composeBom = "2024.10.01"
navigationCompose = "2.8.4"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
ktor = "2.3.12"
kotlinxSerialization = "1.7.3"
coroutines = "1.9.0"
coil = "2.7.0"
datastore = "1.1.1"
junit = "4.13.2"
camerax = "1.4.1"
mlkitFace = "16.1.7"
mlkitFaceMesh = "16.0.0-beta3"
# LiteRT (tên mới của TFLite từ 2.17). / LiteRT is the renamed TFLite line.
litert = "1.0.1"
billing = "7.1.1"
exif = "1.3.7"
media3 = "1.5.1"
pahoMqtt = "1.2.5"

[libraries]
# Compose (versions come from the BOM).
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# AndroidX app plumbing.
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Kotlin ecosystem.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Ktor client (OkHttp engine).
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }

# Image loading.
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# CameraX (feature:camera).
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# ML Kit face detection (feature:beauty).
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFace" }

# ML Kit selfie segmentation (feature:idphoto background removal).
mlkit-selfie-segmentation = { group = "com.google.mlkit", name = "segmentation-selfie", version = "16.0.0-beta6" }
# Face mesh (468 điểm) — thay ARKernel 106-point cho makeup/geometry thời gian thực (W9-E).
mlkit-face-mesh-detection = { group = "com.google.mlkit", name = "face-mesh-detection", version.ref = "mlkitFaceMesh" }
# TFLite/LiteRT — thay model .bin của Manis (W9-E).
# LƯU Ý (bằng chứng 2026-09-22): `org.tensorflow:tensorflow-lite:2.17.0` trên Maven Central chỉ còn POM
# relocation (1411 byte, không có class) và **Gradle không đi theo relocation**, nên module không compile được.
# Dùng thẳng artifact LiteRT 1.0.1 — nó giữ nguyên package `org.tensorflow.lite.*` nên mã nguồn không đổi.
# Alias vẫn tên `tflite` để chỗ dùng không phải sửa.
tflite = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

# Google Play Billing (feature:vip).
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# EXIF rotation handling (camera/editor/beauty).
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exif" }

# MQTT client (feature:community realtime chat — broker nội bộ aedes, WAVE-8).
paho-mqtt = { group = "org.eclipse.paho", name = "org.eclipse.paho.client.mqttv3", version.ref = "pahoMqtt" }

# Media3 (feature:videoedit, feature:livephoto).
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Test only.
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
