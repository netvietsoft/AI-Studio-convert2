# ==============================================================================
# DEPRECATION & DECOMMISSION NOTICE (TASK_024)
# Status: DECOMMISSIONED FROM AUTOMATIC EXECUTION (MANUAL FALLBACK ONLY)
# Authority: Tony - CONVERT2 Development Workspace Standard V2.1
#
# WARNING: Auto-triggers (push, schedule, pull_request) have been permanently
# decommissioned to eliminate race conditions, duplicate execution, and collision
# with the primary multi-agent architecture:
#   - Dispatcher: .github/workflows/convert2-dispatcher.yml
#   - Worker:     .github/workflows/convert2-worker.yml
#   - Integrator: .github/workflows/convert2-integrator.yml
#
# This workflow is strictly preserved for emergency manual rollback/diagnostics
# via manual workflow_dispatch only. Normal tasks MUST NOT use this workflow.
# ==============================================================================

name: CONVERT2 Agent Command Bus (Standalone Fallback - Decommissioned Auto-Trigger)

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Specific Command ID to execute (Required)"
        required: true
        type: string
      execution_lane:
        description: "Execution Lane"
        required: false
        type: string
        default: "default"
      force_rerun:
        description: "Force execution regardless of existing completion"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: convert2-command-bus-${{ inputs.command_id || github.run_id }}
  cancel-in-progress: false

jobs:
  execute-command:
    runs-on: [self-hosted, Windows, convert2]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile and Execute CONVERT2 Command
        shell: powershell
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $lane = "${{ inputs.execution_lane }}"
          if ([string]::IsNullOrWhiteSpace($lane)) { $lane = "default" }
          
          $cmdId = "${{ inputs.command_id }}"

          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File ".\scripts\run_agent_from_github_command.ps1" `
            -RepoPath "${{ github.workspace }}" `
            -CommandId "$cmdId" `
            -ExecutionLane "$lane"

      - name: Upload runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convert2-agent-command-${{ github.run_id }}
          path: .ai/runner/
          if-no-files-found: ignore
          retention-days: 14
