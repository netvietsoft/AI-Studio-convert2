name: CONVERT2 Command Bus Dispatcher

on:
  push:
    branches: [main]
    paths:
      - ".ai/commands/pending/**"
      - ".ai/commands/NEXT_COMMAND.json"
      - "scripts/command_bus_orchestrator.py"
  workflow_dispatch:
    inputs:
      command_id:
        description: "Specific Command ID to dispatch (optional)"
        required: false
        type: string
        default: ""
      execution_lane:
        description: "Execution Lane filter"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "*/3 * * * *"

concurrency:
  group: convert2-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reserve and Dispatch Commands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPECIFIC_CMD: ${{ inputs.command_id }}
          LANE: ${{ inputs.execution_lane }}
        run: |
          set -euo pipefail
          git config user.name "convert2-dispatcher[bot]"
          git config user.email "convert2-dispatcher@netviet.internal"

          # Start from current main before mutating command-bus state.
          git pull --rebase origin main

          # Reconcile stale reservations/leases before selecting ready commands.
          python scripts/command_bus_orchestrator.py recover --timeout 1800
          python scripts/command_bus_orchestrator.py rebuild-index
          python scripts/command_bus_orchestrator.py validate-lifecycle

          # The orchestrator mutates both per-task state and the aggregate root state.
          git add -A .ai/commands .ai/state .ai/state.json .ai/locks.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(command-bus): reconcile stale state before dispatch [run $GITHUB_RUN_ID]"
            # Rebase only from a clean worktree. If another actor advanced main,
            # integrate it before publishing the reconciled state.
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::Unexpected unstaged command-bus changes remain after staging"
              git status --short
              exit 1
            fi
            git pull --rebase origin main
            git push origin main
          fi

          python scripts/command_bus_orchestrator.py dispatch \
            --dispatcher-run-id "$GITHUB_RUN_ID" \
            --command-id "$SPECIFIC_CMD" \
            --lane "$LANE" \
            --max-dispatch 3
