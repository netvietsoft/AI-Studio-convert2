name: CONVERT2 Agent Worker

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Exact Command ID to execute"
        required: true
        type: string
      reservation_token:
        description: "Reservation Token"
        required: false
        type: string
        default: ""
      execution_lane:
        description: "Execution Lane"
        required: false
        type: string
        default: "default"
      runner_label:
        description: "Optional target runner label (reserved for explicit routing; blank uses any self-hosted Windows runner)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: convert2-worker-${{ inputs.command_id }}
  cancel-in-progress: false

jobs:
  execute-command:
    runs-on: [self-hosted]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run Agent Worker
        shell: powershell
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File ".\scripts\run_agent_from_github_command.ps1" `
            -RepoPath "${{ github.workspace }}" `
            -CommandId "${{ inputs.command_id }}" `
            -ReservationToken "${{ inputs.reservation_token }}" `
            -ExecutionLane "${{ inputs.execution_lane || 'default' }}"

      - name: Validate Lifecycle Invariants
        if: always()
        shell: powershell
        run: |
          python -m unittest tests/test_command_bus_lifecycle_invariants.py

      - name: Upload runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convert2-worker-${{ inputs.command_id }}-${{ github.run_id }}
          path: .ai/runner/
          if-no-files-found: ignore
          retention-days: 14
