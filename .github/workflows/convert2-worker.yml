name: CONVERT2 Agent Worker

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Exact Command ID to execute"
        required: true
        type: string
      reservation_token:
        description: "Reservation Token"
        required: false
        type: string
        default: ""
      execution_lane:
        description: "Execution Lane"
        required: false
        type: string
        default: "default"
      runner_label:
        description: "Optional target runner label (reserved for explicit routing; blank uses any self-hosted Windows runner)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: convert2-worker-${{ inputs.command_id }}
  cancel-in-progress: false

jobs:
  execute-command:
    runs-on: [self-hosted]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bootstrap AGY for runner service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner identity: $(whoami)"
          Write-Host "Runner LOCALAPPDATA: $env:LOCALAPPDATA"

          $agyBin = Join-Path $env:LOCALAPPDATA "agy\bin"
          $agyExe = Join-Path $agyBin "agy.exe"
          $existing = Get-Command agy -ErrorAction SilentlyContinue

          if ($existing) {
            $agyExe = $existing.Source
            $agyBin = Split-Path $agyExe -Parent
            Write-Host "Using AGY already visible to runner service."
          } elseif (-not (Test-Path -LiteralPath $agyExe -ErrorAction SilentlyContinue)) {
            Write-Host "AGY is not installed for this service identity; installing from official Google Antigravity installer."
            $installer = Join-Path $env:RUNNER_TEMP "install-antigravity-cli.ps1"
            Invoke-WebRequest -UseBasicParsing -Uri "https://antigravity.google/cli/install.ps1" -OutFile $installer
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer
            if ($LASTEXITCODE -ne 0) { throw "Official AGY installer failed with exit code $LASTEXITCODE" }
          }

          if (-not (Test-Path -LiteralPath $agyExe -ErrorAction SilentlyContinue)) {
            throw "AGY bootstrap did not produce an executable at $agyExe"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $agyBin
          & $agyExe --version
          if ($LASTEXITCODE -ne 0) { throw "AGY binary preflight failed with exit code $LASTEXITCODE" }

      - name: Run Agent Worker
        shell: powershell
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File ".\scripts\run_agent_from_github_command.ps1" `
            -RepoPath "${{ github.workspace }}" `
            -CommandId "${{ inputs.command_id }}" `
            -ReservationToken "${{ inputs.reservation_token }}" `
            -ExecutionLane "${{ inputs.execution_lane || 'default' }}"

      - name: Validate Lifecycle Invariants
        if: always()
        shell: powershell
        run: |
          python -m unittest tests/test_command_bus_lifecycle_invariants.py

      - name: Upload runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convert2-worker-${{ inputs.command_id }}-${{ github.run_id }}
          path: .ai/runner/
          if-no-files-found: ignore
          retention-days: 14
